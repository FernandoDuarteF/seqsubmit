repository_type: pipeline

nf_core_version: 3.4.1

lint:
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
  files_unchanged:
    - .github/PULL_REQUEST_TEMPLATE.md
template:
  org: nf-core
  name: seqsubmit
  description: Submit sequences, assmeblies, mags, etc., to publich archives
  author: Martin Beracochea, Ekaterina Sakharova, Sofiia Ochkalova, Evangelos Karatzas
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - fastqc
    - gpu
  is_nfcore: true
